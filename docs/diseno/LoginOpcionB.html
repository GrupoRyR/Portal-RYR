<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Login opción B</title>
<!-- Option B: full-bleed stage of floating app tiles with an elevated glass card.
     Static prototype for review: self-contained (inline CSS, logos as data URIs,
     Helvetica/Arial only). The "Prototipo" switch in the corner is not part of the design. -->
<style>
:root {
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --fg: #17191C;
  --fg-soft: #45484F;
  --fg-muted: #5F626A;
  --line: #E2E2DE;
  --tile: #F0F0EC;
  --btn: #17191C;
  --btn-hover: #000000;
  --btn-fg: #FFFFFF;
  --focus: #17191C;
  --shadow: 0 1px 2px rgb(23 25 28 / 0.06), 0 12px 32px rgb(23 25 28 / 0.08);
  --stage: #E8E8E3;
  --stage-glow: rgb(255 255 255 / 0.9);
  --float: #FFFFFF;
  --float-fg: #17191C;
  --card: rgb(255 255 255 / 0.86);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --bg: #121315;
  --surface: #1C1D20;
  --fg: #F2F2EF;
  --fg-soft: #C9CBD0;
  --fg-muted: #A4A7AE;
  --line: #2F3136;
  --tile: #26282C;
  --btn: #F2F2EF;
  --btn-hover: #FFFFFF;
  --btn-fg: #17191C;
  --focus: #F2F2EF;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 16px 40px rgb(0 0 0 / 0.45);
  --stage: #0C0D0F;
  --stage-glow: rgb(255 255 255 / 0.07);
  --float: #1F2023;
  --float-fg: #E4E5E8;
  --card: rgb(28 29 32 / 0.84);
  }
}
:root[data-theme="dark"] {
  --bg: #121315;
  --surface: #1C1D20;
  --fg: #F2F2EF;
  --fg-soft: #C9CBD0;
  --fg-muted: #A4A7AE;
  --line: #2F3136;
  --tile: #26282C;
  --btn: #F2F2EF;
  --btn-hover: #FFFFFF;
  --btn-fg: #17191C;
  --focus: #F2F2EF;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 16px 40px rgb(0 0 0 / 0.45);
  --stage: #0C0D0F;
  --stage-glow: rgb(255 255 255 / 0.07);
  --float: #1F2023;
  --float-fg: #E4E5E8;
  --card: rgb(28 29 32 / 0.84);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--fg);
  font-family: Helvetica, Arial, "Helvetica Neue", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, p { margin: 0; }
img { display: block; }
svg { display: block; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 56px;
  padding: 0 28px;
  border-radius: 14px;
  background: var(--btn);
  color: var(--btn-fg);
  font-size: 17px;
  font-weight: 700;
  text-decoration: none;
  transition: background-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
}
.btn:hover { background: var(--btn-hover); }
.btn .ms { width: 20px; height: 20px; }
.btn .arrow { width: 20px; height: 20px; margin-left: 4px; transition: transform 0.15s ease; }

/* The company logos: each on its own ground (Segurex white logo on its
   grey, the SDC logo on white). Brand color lives inside these chips only. */
.companies-list { display: flex; flex-wrap: wrap; gap: 10px; margin: 0; padding: 0; list-style: none; }
.chip { display: inline-flex; align-items: center; justify-content: center; height: 52px; padding: 0 18px; border-radius: 12px; }
.chip-sgx { background: #58595B; }
.chip-sgx img { width: auto; height: 22px; }
.chip-sdc { background: #FFFFFF; box-shadow: inset 0 0 0 1px rgb(23 25 28 / 0.1); }
.chip-sdc img { width: auto; height: 34px; }

/* Prototype only: lets the reviewer switch the theme. Not part of the design. */
.proto {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 4px 4px 10px;
  border-radius: 999px;
  background: #17191C;
  color: #F2F2EF;
  font-size: 12px;
  box-shadow: 0 4px 16px rgb(0 0 0 / 0.25);
}
.proto button {
  border: 0;
  border-radius: 999px;
  padding: 6px 10px;
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
.proto button[aria-pressed="true"] { background: #F2F2EF; color: #17191C; font-weight: 700; }
.proto button:focus-visible { outline: 2px solid #F2F2EF; outline-offset: 1px; }
@media (max-width: 767px) {
  .proto { position: static; width: max-content; margin: 16px auto; }
}


/* Option B: a full-bleed stage of floating app tiles, with the sign-in on an
   elevated glass card in the middle. */
body { background: var(--stage); }
.stage {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 100dvh;
  overflow: hidden;
  padding: 48px 24px;
  background:
    radial-gradient(50% 55% at 50% 50%, var(--stage-glow), transparent 75%),
    radial-gradient(rgb(23 25 28 / 0.07) 1px, transparent 1.6px) 0 0 / 28px 28px;
}
:root[data-theme="dark"] .stage { background: radial-gradient(50% 55% at 50% 50%, var(--stage-glow), transparent 75%), radial-gradient(rgb(255 255 255 / 0.06) 1px, transparent 1.6px) 0 0 / 28px 28px; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .stage { background: radial-gradient(50% 55% at 50% 50%, var(--stage-glow), transparent 75%), radial-gradient(rgb(255 255 255 / 0.06) 1px, transparent 1.6px) 0 0 / 28px 28px; }
}

/* Floating tiles: position, size and tilt per tile (--x, --y, --s, --r), set
   inline; the phone layout overrides a few with !important. */
.floats { position: absolute; inset: 0; margin: 0; padding: 0; list-style: none; pointer-events: none; }
.float {
  position: absolute;
  left: var(--x);
  top: var(--y);
  display: grid;
  place-items: center;
  width: var(--s);
  height: var(--s);
  border-radius: calc(var(--s) * 0.28);
  background: var(--float);
  color: var(--float-fg);
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.06), 0 18px 40px rgb(23 25 28 / 0.14);
  rotate: var(--r);
}
.float svg { width: 44%; height: 44%; }
.float-dark { background: var(--float-fg); color: var(--float); }
.float-far { filter: blur(2px); opacity: 0.55; }

.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  padding: 44px 44px 36px;
  border-radius: 28px;
  background: var(--card);
  -webkit-backdrop-filter: blur(22px) saturate(1.15);
  backdrop-filter: blur(22px) saturate(1.15);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.5), 0 2px 4px rgb(0 0 0 / 0.04), 0 40px 90px rgb(23 25 28 / 0.18);
}
:root[data-theme="dark"] .card { box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.08), 0 40px 90px rgb(0 0 0 / 0.6); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .card { box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.08), 0 40px 90px rgb(0 0 0 / 0.6); }
}

h1 { font-size: 40px; line-height: 1.04; letter-spacing: -0.03em; }
.copy { margin-top: 14px; color: var(--fg-soft); font-size: 17px; }
.card .btn { width: 100%; margin-top: 32px; }
.card .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgb(23 25 28 / 0.25); }

.companies { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); }
.companies-label { margin-bottom: 12px; color: var(--fg-muted); font-size: 13px; font-weight: 700; text-align: center; }
.companies-list { justify-content: center; }
.note { margin-top: 18px; color: var(--fg-muted); font-size: 13px; text-align: center; }

@media (prefers-reduced-motion: no-preference) {
  /* Like kites: three slow swings at different rhythms (drift sideways,
     rise and fall, lean), so each tile traces its own soft, never-repeating
     path. Far tiles move less and slower. */
  .float {
    animation:
      kite-drift var(--d) ease-in-out var(--delay) infinite alternate,
      kite-lift calc(var(--d) * 0.57) ease-in-out var(--delay) infinite alternate,
      kite-lean calc(var(--d) * 0.79) ease-in-out var(--delay) infinite alternate;
  }
  .card { animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
}
@keyframes kite-drift {
  from { translate: calc(var(--a) * -1 * var(--k)) 0; }
  to { translate: calc(var(--a) * var(--k)) 0; }
}
@keyframes kite-lift {
  from { transform: translateY(calc(var(--a) * 0.55)); }
  to { transform: translateY(calc(var(--a) * -0.55)); }
}
@keyframes kite-lean {
  from { rotate: calc(var(--r) - 7deg * var(--k)); }
  to { rotate: calc(var(--r) + 7deg * var(--k)); }
}
@keyframes rise { from { opacity: 0; transform: translateY(16px) scale(0.98); } }

/* Phone: the card fills the width; only the tiles near the edges stay. */
@media (max-width: 767px) {
  .stage { place-items: end center; padding: 168px 16px 24px; }
  .float-desk { display: none; }
  .card { padding: 32px 24px 28px; border-radius: 24px; }
  h1 { font-size: 32px; }
  .chip { height: 42px; padding: 0 12px; }
  .chip-sgx img { height: 17px; }
  .chip-sdc img { height: 26px; }
}

.float-phone { display: none; }
@media (max-width: 767px) {
  .float-phone { display: grid; }
  /* A narrower swing, so the kites stay on screen. */
  .float { --a: 14px !important; }
  .floats .float:nth-child(1) { --x: 6% !important; --y: 32px !important; --s: 88px !important; }
  .floats .float:nth-child(5) { --x: 70% !important; --y: 20px !important; --s: 92px !important; }
  .floats .float:nth-child(11) { --x: 40% !important; --y: 64px !important; --s: 64px !important; }
}

</style>

<div class="proto" role="group" aria-label="Tema del prototipo">
  <span>Prototipo</span>
  <button type="button" data-t="">Sistema</button>
  <button type="button" data-t="light">Claro</button>
  <button type="button" data-t="dark">Oscuro</button>
</div>
<script>
  // Prototype only: ?tema=claro|oscuro, or the buttons, override the system theme.
  const root = document.documentElement;
  const buttons = [...document.querySelectorAll('.proto button')];
  const setTheme = (theme) => {
    if (theme) root.dataset.theme = theme; else delete root.dataset.theme;
    buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.t === theme)));
  };
  const asked = new URLSearchParams(location.search).get('tema');
  setTheme(asked === 'oscuro' ? 'dark' : asked === 'claro' ? 'light' : '');
  buttons.forEach((b) => b.addEventListener('click', () => setTheme(b.dataset.t)));
</script>
