<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logos animados</title>
<style>
  :root { --surface:#F4F4F5; --card:#FFFFFF; --fg:#1C1D20; --muted:#5f6066; --line:#e4e4e7;
          --ok:#1F7A45; --warn-bg:#FFF4D6; --warn:#7A5300; --bad-bg:#FDE7E7; --bad:#A12222; }
  :root[data-brand="segurex"]   { --brand-accent:#F26522; --brand-button:#C6531C; --brand-ink:#943E15; --brand-text:#58595B; --brand-dark:#58595B; }
  :root[data-brand="derivados"] { --brand-accent:#0B5FA5; --brand-button:#0B5FA5; --brand-ink:#073B66; --brand-text:#073B66; --brand-dark:#073B66; }
  :root[data-theme="dark"] { --surface:#1C1D20; --card:#26272b; --fg:#ECECEE; --muted:#A8A9AA; --line:#3a3b40;
          --ok:#5BC98A; --warn-bg:#3a2f12; --warn:#F2C76B; --bad-bg:#3d1c1c; --bad:#F29C9C; }
  :root[data-theme="dark"][data-brand="segurex"]   { --brand-ink:#F26522; --brand-text:#A8A9AA; }
  :root[data-theme="dark"][data-brand="derivados"] { --brand-ink:#4D8ABD; --brand-text:#4D8ABD; }

  * { box-sizing:border-box; }
  body { margin:0; font-family:Helvetica, Arial, "Helvetica Neue", sans-serif; background:var(--surface); color:var(--fg); }
  header { background:var(--brand-dark); color:#fff; display:flex; align-items:center; gap:12px; padding:12px 16px; }
  header img { height:26px; width:auto; }
  :root[data-brand="derivados"] header img { background:#fff; padding:3px 8px; border-radius:6px; height:32px; }
  header .who { margin-left:auto; font-size:14px; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 90px; }
  h1 { color:var(--brand-ink); font-size:24px; margin:4px 0 2px; }
  .sub { color:var(--muted); margin:0 0 18px; }
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
  @media (min-width:640px) { .grid { grid-template-columns:repeat(3, minmax(0,1fr)); } }
  @media (min-width:1024px) { .grid { grid-template-columns:repeat(5, minmax(0,1fr)); } }

  .card { position:relative; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px;
          display:flex; flex-direction:column; gap:10px; min-height:150px;
          transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
  .card a { color:inherit; text-decoration:none; font-weight:bold; font-size:15px; }
  .card a::after { content:""; position:absolute; inset:0; border-radius:14px; }
  .card a:focus-visible { outline:none; }
  .card:has(a:focus-visible) { outline:3px solid var(--brand-accent); outline-offset:2px; }
  .card p { margin:0; font-size:13px; color:var(--muted); line-height:1.35; }
  .state { margin-top:auto; font-size:12px; font-weight:bold; display:flex; align-items:center; gap:6px; }
  .state.ok { color:var(--ok); } .state.ok::before { content:""; width:8px; height:8px; border-radius:50%; background:currentColor; }
  .state.maint { color:var(--warn); background:var(--warn-bg); padding:4px 8px; border-radius:8px; align-self:flex-start; }
  .state.fail  { color:var(--bad);  background:var(--bad-bg);  padding:4px 8px; border-radius:8px; align-self:flex-start; }

  /* ---------- The animated logo ---------- */
  .logo { position:relative; width:48px; height:48px; border-radius:12px; display:grid; place-items:center;
          background:color-mix(in srgb, var(--app, var(--brand-accent)) 14%, var(--card));
          color:var(--app, var(--brand-accent)); }
  :root[data-theme="dark"] .logo:not(.initial) { color:var(--brand-ink); background:color-mix(in srgb, var(--brand-ink) 16%, var(--card)); }
  .logo svg { width:28px; height:28px; }
  .logo.initial { background:var(--app, var(--brand-button)); color:#fff; font-size:20px; font-weight:bold; }

  /* 1. Entrance: icons pop in one after another when the home opens */
  .anim .logo { animation:pop .55s cubic-bezier(.34,1.56,.64,1) both; animation-delay:calc(var(--i) * 60ms + 120ms); }
  @keyframes pop { from { opacity:0; transform:scale(.4) rotate(-12deg); } to { opacity:1; transform:none; } }

  /* 2. Hover / keyboard focus: the card lifts and the logo does its own move */
  @media (hover:hover) {
    .card:hover { transform:translateY(-3px); box-shadow:0 10px 24px rgba(0,0,0,.10); border-color:color-mix(in srgb, var(--brand-accent) 45%, var(--line)); }
  }
  .card:hover .logo, .card:has(a:focus-visible) .logo { animation:var(--move) .7s ease both; }
  .logo::after { content:""; position:absolute; inset:-4px; border-radius:15px; border:2px solid var(--app, var(--brand-accent));
                 opacity:0; transform:scale(.85); transition:opacity .25s, transform .25s; }
  .card:hover .logo::after, .card:has(a:focus-visible) .logo::after { opacity:.55; transform:none; }

  /* Each app has a motion that fits its icon */
  @keyframes bounce { 0%,100% { transform:none; } 30% { transform:translateY(-6px); } 55% { transform:translateY(0) scaleY(.9); } 75% { transform:translateY(-2px); } }
  @keyframes wiggle { 0%,100% { transform:none; } 20% { transform:rotate(-10deg); } 40% { transform:rotate(8deg); } 60% { transform:rotate(-5deg); } 80% { transform:rotate(3deg); } }
  @keyframes flip   { 0% { transform:perspective(200px) rotateY(0); } 100% { transform:perspective(200px) rotateY(360deg); } }
  @keyframes pulse  { 0%,100% { transform:none; } 40% { transform:scale(1.15); } 70% { transform:scale(.95); } }
  @keyframes spin   { to { transform:rotate(180deg); } }

  /* 3. Tap on a phone: quick press feedback before opening */
  .card:active .logo { transform:scale(.88); transition:transform .08s; }

  /* 4. Status: maintenance logo is quiet, failing logo shows a calm alert ring */
  .card.is-maint .logo { filter:grayscale(1); opacity:.6; }
  .card.is-maint:hover .logo { animation:none; }
  .card.is-fail .logo::before { content:""; position:absolute; top:-4px; right:-4px; width:12px; height:12px; border-radius:50%;
                                background:var(--bad); box-shadow:0 0 0 0 var(--bad); animation:alert 2s ease-out infinite; }
  @keyframes alert { 0% { box-shadow:0 0 0 0 color-mix(in srgb, var(--bad) 60%, transparent); } 70%,100% { box-shadow:0 0 0 8px transparent; } }

  /* Favorite star */
  .fav { position:absolute; top:6px; right:6px; z-index:2; width:40px; height:40px; border:0; background:none; cursor:pointer;
         color:var(--muted); border-radius:10px; display:grid; place-items:center; }
  .fav:focus-visible { outline:3px solid var(--brand-accent); }
  .fav svg { width:20px; height:20px; }
  .fav[aria-pressed="true"] { color:var(--brand-button); }
  .fav[aria-pressed="true"] svg { fill:currentColor; animation:star .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes star { 0% { transform:scale(.5) rotate(-30deg); } 100% { transform:none; } }

  /* Respect "reduce motion": no movement, only the static design */
  @media (prefers-reduced-motion:reduce) { .logo, .logo::before, .fav svg, .card { animation:none !important; transition:none !important; } }
  :root.no-motion .logo, :root.no-motion .logo::before, :root.no-motion .fav svg, :root.no-motion .card { animation:none !important; transition:none !important; }

  /* Prototype-only controls */
  .ctl { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
         padding:10px 16px; background:color-mix(in srgb, var(--card) 92%, transparent); border-top:1px solid var(--line); }
  .ctl button { font:inherit; font-size:13px; padding:7px 12px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  .ctl button[aria-pressed="true"] { background:var(--brand-button); color:#fff; border-color:transparent; }
</style>
</head>
<body>
<header><img id="logo" alt="Segurex"><span class="who">Jhon · Administrador</span></header>
<main>
  <h1>Hola, Jhon</h1>
  <p class="sub">Pase el mouse (o toque) sobre una aplicación.</p>
  <div class="grid anim" id="grid"></div>
</main>

<div class="ctl" aria-label="Controles del prototipo">
  <button type="button" id="replay">Repetir entrada</button>
  <button type="button" data-b="segurex" aria-pressed="true">Segurex</button>
  <button type="button" data-b="derivados" aria-pressed="false">Derivados</button>
  <button type="button" id="theme" aria-pressed="false">Modo oscuro</button>
  <button type="button" id="motion" aria-pressed="false">Reducir movimiento</button>
</div>

  const root = document.documentElement;
  function brand(b) {
    root.dataset.brand = b;
