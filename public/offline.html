<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#F5F5F2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121315" media="(prefers-color-scheme: dark)">
    <title>Sin conexión</title>
    <!-- Shown by the service worker (resources/js/sw.js) when a page cannot
         load without network. Self-contained: no build assets or fonts. -->
    <style>
        :root { color-scheme: light dark; --ground: #f5f5f2; --surface: #ffffff; --line: #d6d6d0; --fg: #17191c; --soft: #45484e; --notice: #7a4f00; --notice-bg: #fff4db; }
        @media (prefers-color-scheme: dark) {
            :root { --ground: #121315; --surface: #1c1d20; --line: #3a3c42; --fg: #f2f2ef; --soft: #c9cbd0; --notice: #f5d58a; --notice-bg: #2a2418; }
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body { margin: 0; min-height: 100dvh; background: var(--ground); color: var(--fg); font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.5; }
        main { max-width: 28rem; margin: 0 auto; padding: 4rem 1.5rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
        .icon { display: flex; align-items: center; justify-content: center; width: 4.5rem; height: 4.5rem; border-radius: 50%; background: var(--notice-bg); color: var(--notice); }
        h1 { margin: 0.5rem 0 0; font-size: 1.75rem; line-height: 1.1; letter-spacing: -0.02em; }
        p { margin: 0; color: var(--soft); font-size: 1rem; }
        .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; }
        .button { display: inline-flex; align-items: center; justify-content: center; min-height: 2.75rem; padding: 0 1.25rem; border-radius: 12px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
        .primary { border: 0; background: var(--fg); color: var(--ground); }
        .secondary { border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
        .button:focus-visible { outline: 3px solid var(--notice); outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <span class="icon" aria-hidden="true">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19h.01M3 3l18 18"/></svg>
        </span>
        <h1>Sin conexión</h1>
        <p>No hay conexión a internet. Las aplicaciones necesitan internet para abrirse.</p>
        <p>Revisa el wifi o los datos móviles e inténtalo de nuevo.</p>
        <div class="actions">
            <button type="button" class="button primary" onclick="location.reload()">Reintentar</button>
            <a class="button secondary" href="/">Ir al inicio</a>
        </div>
    </main>
</body>
</html>
